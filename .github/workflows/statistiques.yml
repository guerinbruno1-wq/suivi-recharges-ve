# Additionne les téléchargements de toutes les versions (Android, Windows, mode d'emploi)
# et publie le résultat dans stats.json sur la branche « stats », lu par les badges du README.
name: Statistiques de téléchargement

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Compter les téléchargements
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$DEPOT/releases" --paginate --jq '[.[].assets[]]' | jq -s 'add // [] | {
            android: (map(select(.name | endswith(".apk")) | .download_count) | add // 0),
            windows: (map(select(.name | endswith(".msi")) | .download_count) | add // 0),
            mode_emploi: (map(select(.name | endswith(".pdf")) | .download_count) | add // 0),
            total: (map(.download_count) | add // 0),
            mis_a_jour: (now | todate)
          }' > stats.json
          cat stats.json
          mkdir publication && cp stats.json publication/ && cd publication
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -q -m "Statistiques de téléchargement"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${DEPOT}.git" stats
